# A Telemetry Contract that satisfies every Standard in the catalog.
# CI runs `otel-guardrail check` over this file and expects exit code 0.
apiVersion: guardrail.otel/v1
kind: TelemetryContract
service_name: checkout-api
owner: team-payments
tier: tier-1
signals:
  - traces
  - metrics
  - logs
resource_attributes:
  service.name: checkout-api
  service.version: "2.4.1"
  deployment.environment: production

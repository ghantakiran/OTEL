# The org's Waiver register — the source of truth for real exemptions (ADR 0004).
#
# A Waiver is a time-boxed, owner-approved exemption letting ONE service skip
# ONE Standard until an expiry date. Until then the Standard is still reported
# for that service, it just stops failing the build; on the day after `expires`
# enforcement reverts on its own, with nobody taking an action.
#
# Waivers live here, in the platform team's repository, and never in a service
# repository: a service must not be able to waive itself. Adding one is a pull
# request the platform team approves. See docs/waivers.md.
#
# `reason`, `approved_by` and `expires` are all required. A Waiver missing any
# of them is rejected — `otel-guardrail check` exits 2, "the Guardrail could not
# run" — because an unexplained, unapproved or unbounded Waiver is exactly the
# permanent hole ADR 0003 warns about. Two Waivers for the same service and
# Standard are rejected too: one of them would sit here doing nothing.
#
# THIS FILE IS MEANT TO CHANGE. File a Waiver by adding an entry; retire one by
# deleting it. No test pins its contents — the tests assert only that whatever
# is here is well-formed. The illustrative Waivers used by the tests and the CI
# demonstrations live in guardrail/examples/demo-waivers.yaml instead, so that
# normal operation of this register never breaks a test.
#
# An empty register is a good sign, not a broken file: it means no service
# currently needs an exemption.
apiVersion: guardrail.otel/v1
kind: WaiverRegister
waivers: []

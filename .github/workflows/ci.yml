name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required, and not only for the guardrail-examples job below: the CLI
          # tests run `check` over the sample Contracts, and `check` always dates
          # the service from git history. In a shallow clone the Guardrail now
          # refuses to guess (exit 2) instead of silently classifying every
          # service as new, so those tests fail without full history — which is
          # the correct behaviour made visible.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The Waiver-expiry cron's open/update/close branching is bash, so `go
      # test` cannot reach it. Stubs `gh`; creates no issues and needs no auth.
      - run: bash .github/scripts/waiver-expiry-issue_test.sh
      # The worked examples in docs/ are executable promises. Three of four had
      # gone stale before anyone noticed, because prose has no test.
      - run: bash .github/scripts/docs-examples_test.sh

  guardrail-examples:
    name: Preflight Guardrail blocks what it should
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Enforcement Epoch dates a service by the first commit that added
          # its Telemetry Contract; checkout's default shallow clone has no such
          # history, and the Guardrail stops rather than guessing.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o otel-guardrail ./guardrail/cmd/otel-guardrail

      - name: Compliant Contract passes
        run: ./otel-guardrail check guardrail/examples/compliant-contract.yaml

      - name: Violating Contract blocks the build
        run: |
          if ./otel-guardrail check guardrail/examples/missing-attributes-contract.yaml; then
            echo "::error::violating Telemetry Contract exited 0 — the Guardrail is not blocking"
            exit 1
          fi

      - name: A Waiver in force holds its Standard back
        run: ./otel-guardrail check --waivers guardrail/examples/demo-waivers.yaml --as-of 2026-08-01 guardrail/examples/waived-contract.yaml

      - name: A tier-1 Contract compiles to collector config
        run: ./otel-guardrail compile guardrail/examples/compliant-contract.yaml

      - name: A tier-3 Contract compiles too — every tier has a Profile
        run: ./otel-guardrail compile guardrail/examples/tier-3-least-signals-contract.yaml

      - name: A Contract outside the Service Tier Taxonomy does not compile
        run: |
          if ./otel-guardrail compile guardrail/examples/unknown-tier-contract.yaml; then
            echo "::error::a Contract declaring an unknown Service Tier compiled anyway"
            exit 1
          fi

      - name: An expired Waiver holds nothing back
        run: |
          if ./otel-guardrail check --waivers guardrail/examples/demo-waivers.yaml guardrail/examples/expired-waiver-contract.yaml; then
            echo "::error::an expired Waiver still held a blocking Standard back"
            exit 1
          fi

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # The Waiver-expiry cron's open/update/close branching is bash, so `go
      # test` cannot reach it. Stubs `gh`; creates no issues and needs no auth.
      - run: bash .github/scripts/waiver-expiry-issue_test.sh

  guardrail-examples:
    name: Preflight Guardrail blocks what it should
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Enforcement Epoch dates a service by the first commit that added
          # its Telemetry Contract; checkout's default shallow clone has no such
          # history, and the Guardrail stops rather than guessing.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o otel-guardrail ./guardrail/cmd/otel-guardrail

      - name: Compliant Contract passes
        run: ./otel-guardrail check guardrail/examples/compliant-contract.yaml

      - name: Violating Contract blocks the build
        run: |
          if ./otel-guardrail check guardrail/examples/missing-attributes-contract.yaml; then
            echo "::error::violating Telemetry Contract exited 0 — the Guardrail is not blocking"
            exit 1
          fi

      - name: A Waiver in force holds its Standard back
        run: ./otel-guardrail check --as-of 2026-08-01 guardrail/examples/waived-contract.yaml

      - name: An expired Waiver holds nothing back
        run: |
          if ./otel-guardrail check guardrail/examples/expired-waiver-contract.yaml; then
            echo "::error::an expired Waiver still held a blocking Standard back"
            exit 1
          fi

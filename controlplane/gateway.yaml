# The org's Gateway Declaration — the shape of the one shared Gateway.
#
# There is exactly one of these because there is exactly one Gateway tier. That
# is what makes it a different kind of document from a Pipeline Profile:
#
#   controlplane/profiles.yaml   per Service Tier, many of them, selected by tier.
#                                Configures a service's AGENT.
#   controlplane/gateway.yaml    one shared piece of infrastructure, selected by
#                                nobody. Configures the GATEWAY.
#
# A Profile could not own this. Three tier Profiles each naming a Gateway shape
# would describe three Gateways, and the org runs one; merging them would give the
# Gateway's shape no owner. So the Gateway's own shape is declared once, here
# (ADR 0013), while facts that are genuinely per-tier stay in the Profile — the
# tail-sampling budget `sampling.traces_percent` is the standing example, and
# nothing reads it yet (#40).
#
# Compiling cross-checks the two: every Profile's `gateway_endpoint` must be the
# `address` below. An Agent forwarding to a port the Gateway does not listen on is
# a topology that silently drops everything, and it is catchable here rather than
# at 3am.
#
# WHAT IS DECLARED HERE, and why it is not elsewhere:
#
#   address           Where Agents reach the Gateway. One value, because every
#                     Agent in the fleet forwards to the same place. The Gateway's
#                     OTLP receiver is derived from its port.
#   memory_limit_mib  The Gateway's memory ceiling. Higher than any Agent's: it
#                     absorbs the whole fleet's telemetry, and nothing co-located
#                     with it is degraded by its footprint.
#   batch             How telemetry is regrouped on the way out. Agents batch per
#                     service; the Gateway rebatches across all of them, which is
#                     the point of having a Gateway at all.
#   spill_root        The volume persistent sending queues are written to. One
#                     mount, so it is a Gateway fact — whereas WHETHER a Backend
#                     spills is that Backend's durability decision, below. Each
#                     spilling Backend gets its own subdirectory here, named after
#                     it; the directory is derived rather than declared so that two
#                     Backends sharing one storage instance — one file lock, one
#                     disk budget, one corruption blast radius — cannot be written.
#   backends          Where telemetry lands. Declared here and nowhere else, which
#                     is what "services are Backend-agnostic" means in practice
#                     (ADR 0007): adding or swapping a Backend touches this file,
#                     not the fleet.
#
# THE BACKENDS ARE ROLE-NAMED, NOT VENDOR-NAMED. `primary-apm` is a role the org
# fills with some product; the day it is filled with a different one, this file
# changes and nothing else does. A `backend: splunk` here would put a vendor's name
# in the compiled config of every Gateway, in git history, and in the exporter IDs
# that C7's self-observation metrics are labelled by — and a Splunk migration would
# then be a rename across all of it. Services are Backend-agnostic (ADR 0007); so
# is this repository.
#
# EACH BACKEND IS ISOLATED FROM THE OTHERS. That is the whole point of fanning out
# from one place. `delivery` is per Backend, never per Gateway, so each compiles to
# its own exporter with its own sending queue, its own retry, and — when it spills
# — its own storage extension on its own directory (ADR 0010). One shared queue is
# exactly what makes one slow Backend everyone's outage; one shared storage
# instance would re-couple them again a layer down.
#
#   queue_size   How much this Backend's telemetry the Gateway holds while it is
#                not answering, before dropping. Sized by what the org would rather
#                lose.
#   retry        Whether a failed export to it is retried.
#   spill        Whether that queue is written to disk instead of held in memory,
#                so it survives the Gateway restarting while this Backend is down.
#                It needs a storage extension, which is the collector's contrib
#                distribution rather than core — a real, durable constraint on
#                which collector build a Gateway runs (ADR 0014).
apiVersion: guardrail.otel/v1
kind: GatewayDeclaration

gateway:
  address: otel-gateway.observability.svc.cluster.local:4317
  memory_limit_mib: 1024
  batch:
    timeout: 5s
    send_batch_size: 8192
  spill_root: /var/lib/otelcol/spill

  # THE GATEWAY'S OWN PLACE IN THE TELEMETRY IT CARRIES (ADR 0010, ADR 0016).
  #
  # The platform observes itself, and there is no status endpoint, no heartbeat
  # and no back-channel — deliberately, and none is to be added. What an operator
  # watches is this: the Gateway's own OTLP, arriving in a Backend beside the
  # fleet's, saying which configuration it is running and how its per-Backend
  # queues are doing.
  #
  #   backend              Which Backend the Gateway's OWN signals go to, and they
  #                        go there DIRECTLY — not through the Gateway's pipelines.
  #                        That is the whole point: they report on those pipelines'
  #                        exporters, so queueing behind one would mean the metric
  #                        that says "this Backend has stopped answering" is held
  #                        by the Backend that has stopped answering. The route has
  #                        no queue, no retry and no batch, so it cannot be blocked
  #                        by the outage it exists to report.
  #
  #                        It must be a Backend declared below, and one that
  #                        receives metrics. Choose the most available one: this is
  #                        the Backend that goes blind if it is the one that fails.
  #   resource_attributes  Who the Gateway says it is. The Gateway is not a service
  #                        and has no Telemetry Contract, so what a Contract would
  #                        have declared is declared here — and it is held to the
  #                        same Standards: a Gateway whose own telemetry violates a
  #                        `block` Standard it tags the fleet with does not compile.
  #                        `service.version` is the pinned collector distribution's
  #                        (ADR 0014) and moves when that pin moves.
  self_telemetry:
    backend: primary-apm
    resource_attributes:
      service.name: otel-gateway
      service.version: 0.127.0
      deployment.environment: production
      service.namespace: observability
  backends:
    - backend: primary-apm
      description: >-
        The org's primary APM Backend, reached over OTLP, and the one an incident
        is worked from. It takes every Signal because correlating them is the
        reason to have it. Telemetry the org cannot lose goes here, so its queue is
        the largest, retried, and written to disk.
      endpoint: apm-otlp.observability.svc.cluster.local:4317
      delivery:
        queue_size: 20000
        retry: true
        spill: true

    - backend: metrics-store
      description: >-
        The long-retention metrics Backend — dashboards and capacity planning, not
        incident triage. It takes metrics ONLY: it has nowhere to put a span, and
        exporting traces to it would produce failures indistinguishable from it
        being down. Durable, because a gap in a capacity series is not recoverable
        after the fact.
      endpoint: metrics-otlp.observability.svc.cluster.local:4317
      signals: [metrics]
      delivery:
        queue_size: 10000
        retry: true
        spill: true

    - backend: cold-archive
      description: >-
        Cheap long-term retention for traces and logs, read for audit and for
        incidents older than the primary APM keeps. Nothing is waiting on it, so it
        gets a small in-memory queue and no spill: an archive that loses an hour
        during an outage is an acceptable outcome, and disk the primary APM could
        have used is not.
      endpoint: archive-otlp.observability.svc.cluster.local:4317
      signals: [traces, logs]
      delivery:
        queue_size: 2000
        retry: true
